
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cosas para hacer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/ba0ece2d64.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body >
    <h1 >"Cosas para hacer "</h1>

    <div class="input-div">
        <input type="text" placeholder="tarea a agregar">
        <button class="boton-agregar">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <div class="container">
        <div class="item">
            <input class="item-imput" type="text" disabled>

            <button class="boton-editar">
                <i class="fas fa-lock"></i>
            </button>

            <button class="boton-quitar">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
